<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت عملکرد کارشناس</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tahoma', 'Segoe UI', sans-serif;
      background: #f0f2f5;
      direction: rtl;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white;
      padding: 24px;
      text-align: center;
    }
    .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .header p { opacity: 0.9; font-size: 0.9rem; }
    .form-body { padding: 28px; }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #444;
    }
    select, input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 560px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn:hover { background: #1557b0; }
    .btn:disabled {
      background: #90caf9;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
    }
    .message.success {
      background: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }
    .message.error {
      background: #fce8e6;
      color: #c5221f;
      border: 1px solid #f5c6cb;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a73e8;
      margin: 24px 0 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e8f0fe;
    }
    .admin-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
    }
    .admin-link a {
      color: #1a73e8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ثبت عملکرد روزانه</h1>
      <p>سیستم ثبت آمار پردازش و صدور ثالث</p>
    </div>

    <div class="form-body">
      <form id="recordForm">
        <!-- انتخاب کارشناس -->
        <div class="form-group">
          <label for="expertName">نام کارشناس</label>
          <select id="expertName" name="expertName" required>
            <option value="">-- انتخاب کنید --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="shift">شیفت (خودکار)</label>
          <input type="text" id="shift" name="shift" readonly style="background:#f5f5f5;">
        </div>

        <div class="section-title">آمار پردازش</div>
        <div class="grid-2">
          <div class="form-group">
            <label>تعداد پردازش اولیه ثالث</label>
            <input type="number" name="primaryProcess" min="0" value="0" required>
          </div>
          <div class="form-group">
            <label>تعداد پردازش ثانویه ثالث</label>
            <input type="number" name="secondaryProcess" min="0" value="0" required>
          </div>
        </div>

        <div class="section-title">آمار صدور ثالث</div>
        <div class="grid-2">
          <div class="form-group">
            <label>زیر ۱۵ دقیقه</label>
            <input type="number" name="under15" min="0" value="0" required>
          </div>
          <div class="form-group">
            <label>۱۵ تا ۲۰ دقیقه</label>
            <input type="number" name="between15_20" min="0" value="0" required>
          </div>
          <div class="form-group">
            <label>۲۰ تا ۳۰ دقیقه</label>
            <input type="number" name="between20_30" min="0" value="0" required>
          </div>
          <div class="form-group">
            <label>بالای ۳۰ دقیقه</label>
            <input type="number" name="over30" min="0" value="0" required>
          </div>
        </div>

        <div class="section-title">سایر آمار</div>
        <div class="grid-2">
          <div class="form-group">
            <label>تعداد سفارشات لغو شده</label>
            <input type="number" name="canceled" min="0" value="0" required>
          </div>
          <div class="form-group">
            <label>تعداد خطای صدور</label>
            <input type="number" name="errors" min="0" value="0" required>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">ثبت اطلاعات</button>
      </form>

      <div id="message" class="message"></div>

      <div class="admin-link">
        <a href="#" onclick="showAdmin()">مدیریت لیست کارشناسان (ادمین)</a>
      </div>
    </div>
  </div>

  <script>
    let experts = [];

    // بارگذاری لیست کارشناس‌ها
    function loadExperts() {
      google.script.run
        .withSuccessHandler(function(list) {
          experts = list;
          const select = document.getElementById("expertName");
          select.innerHTML = '<option value="">-- انتخاب کنید --</option>';
          list.forEach(exp => {
            const opt = document.createElement("option");
            opt.value = exp.name;
            opt.textContent = exp.name;
            select.appendChild(opt);
          });
        })
        .getExperts();
    }

    // وقتی کارشناس انتخاب شد، شیفتش خودکار پر بشه
    document.getElementById("expertName").addEventListener("change", function() {
      const selected = experts.find(e => e.name === this.value);
      document.getElementById("shift").value = selected ? selected.shift : "";
    });

    // ارسال فرم
    document.getElementById("recordForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "در حال ثبت...";

      const formData = {
        expertName: this.expertName.value,
        shift: this.shift.value,
        primaryProcess: this.primaryProcess.value,
        secondaryProcess: this.secondaryProcess.value,
        under15: this.under15.value,
        between15_20: this.between15_20.value,
        between20_30: this.between20_30.value,
        over30: this.over30.value,
        canceled: this.canceled.value,
        errors: this.errors.value
      };

      google.script.run
        .withSuccessHandler(function(res) {
          const msg = document.getElementById("message");
          msg.style.display = "block";
          if (res.success) {
            msg.className = "message success";
            msg.textContent = res.message;
            document.getElementById("recordForm").reset();
            document.getElementById("shift").value = "";
          } else {
            msg.className = "message error";
            msg.textContent = res.message;
          }
          btn.disabled = false;
          btn.textContent = "ثبت اطلاعات";
        })
        .withFailureHandler(function(err) {
          const msg = document.getElementById("message");
          msg.style.display = "block";
          msg.className = "message error";
          msg.textContent = "خطای ارتباط: " + err.message;
          btn.disabled = false;
          btn.textContent = "ثبت اطلاعات";
        })
        .submitRecord(formData);
    });

    // ادمین ساده (فعلاً فقط هشدار)
    function showAdmin() {
      alert("برای مدیریت لیست کارشناسان، مستقیم به شیت «Experts» در گوگل شیت بروید و نام و شیفت را اضافه یا ویرایش کنید.\n\nبعداً می‌توانیم صفحه ادمین جداگانه بسازیم.");
    }

    // شروع
    loadExperts();
  </script>
</body>
</html>
